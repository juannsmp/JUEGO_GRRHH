.item{border:1px solid var(--b);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--p2)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;overflow:auto}
.fade{animation:fd .6s}
.mc{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:22px;max-width:480px;width:100%;display:grid;gap:12px}

.big{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.1;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px}.tile b{display:block;font-size:26px;font-weight:800;line-height:1.1;margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px}
.vt{display:flex;gap:8px;padding:5px 0;font-size:13px}.vt.ob{color:var(--m)}.vt.lk{color:#474a54}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}}

function startY(){s.n=2+(Math.random()<.5);s.left=s.n;s.ensoL=(s.ensoL||0)-1;if(s.ensoL<=0){s.enso=shuf(["Neutro","Neutro","El Niño","La Niña"])[0];s.ensoL=2+(Math.random()<.5)}s.v0=vis();s.log=[];s.res=0;s.trans=0;s.scr="ca";newCard();R()}

function draw(){const h=s.qq.find(x=>x.n<=0);s.qq.forEach(x=>x.n--);if(h){s.qq=s.qq.filter(x=>x!=h);return CARDS.find(c=>c.id==h.id)}
const v=s.v;let p=CARDS.filter(c=>ok(c)&&!s.seen[c.i]);if(!p.length)p=CARDS.filter(c=>ok(c)&&!c.u);
const w=c=>(c.w||1)*(c.k=="tec"?(c.ro==s.rid?2:c.ro=="gen"?.8:c.cr==s.rid?.5:.05):1)*(c.k=="cli"&&Math.min(v.ab,v.pr,v.am)<35?2:1)*(c.k=="rel"&&Math.min(v.prod,v.soc,v.gob)<30?1.6:1)*(c.k=="ins"?1.5:1);
let t=p.reduce((a,c)=>a+w(c),0)*Math.random();for(const c of p){t-=w(c);if(t<=0){s.seen[c.i]=1;return c}}s.seen[p[0].i]=1;return p[0]}
function pick(i){if(s.res)return;const c=s.card,o=c.o[i],a=vis();ap(o.e);s.cnt.x++;if(c.k=="tec")s.cnt.t++;if(o.g)s.cnt.y++;if(o.a)s.cnt.z++;if(c.fl)s.f[c.fl]=1;if(o.nx)s.qq.push({id:o.nx[0],n:o.nx[1]});
const dead=s.v.int<=0?"Escándalo: se supo todo lo que firmaste de favor y quedaste fuera del sector.":s.v.jef<=0?"Destitución: la jefatura perdió toda la confianza en vos.":s.v.ene<=0?"Burnout: no diste más y pediste licencia sin fecha de regreso.":0;
s.left--;s.log.unshift({w:c.who,t:o.f});s.res={o,c,dead,d:chips(a,vis())};R()}
function nxt(){if(s.res.dead)return fin(s.res.dead);s.res=0;if(s.left>0)newCard();else if(closeY())return;R()}
function closeY(){ap({ene:Math.round((70-s.v.ene)/2),pla:Math.round((50-s.v.pla)/4)});ap(Object.fromEntries(Object.keys(E[s.es][2]).map(k=>[k,2])));const nw=V.filter(([f,t])=>!vit.includes(t)&&f(s)).map(x=>x[1]);vit.push(...nw);V.forEach(([f,t])=>{if(f(s)&&!s.gotC.includes(t))s.gotC.push(t)});try{localStorage.pa=JSON.stringify(vit)}catch(e){}
s.crit=Math.min(...B.map(k=>s.v[k]))<=10?s.crit+1:0;if(s.crit>=2){fin("Destitución: la cuenca entró en crisis dos años seguidos.");return 1}
s.hist.push({i:s.inst,o:ovr(),c:cargo()});s.T={hd:pickH(),nw};s.trans=1}
function nsea(){if(s.yr>=s.N)return fin(`Cerrás tu carrera tras ${s.N} años: la cuenca queda en tus manos y el expediente al día.`,1);s.yr++;s.age++;if([4,7].includes(s.yr))offers();else startY()}
function trans(){const t=s.T;return `<div class="ov fade"><div class=mc><span class=lbl>Cierre del año ${s.yr} de ${s.N} · edad ${s.age}</span><h2>${t.hd}</h2><div>${chips(s.v0,vis())||`<span style="color:var(--m)">Año sin cambios grandes</span>`}</div><p style="color:var(--m)">Nivel profesional ${ovr()}${t.nw.length?". Logro: "+t.nw.join(", "):""}.</p><button class=btn onclick=nsea()>${s.yr>=s.N?"Ver desenlace":"Pasar al año "+(s.yr+1)}</button></div></div>`}
function dp(){const c=s.card,r=s.res;if(s.trans)return"";
if(r)return `<div class="panel dp"><span class=v style="color:${c.k=="tec"?r.o.g?"var(--g)":"var(--r)":"var(--a)"}">${c.k=="tec"?r.o.g?"Bien fundado":"No cierra con la normativa":"Consecuencias"}</span><p>${r.o.f}</p><div>${r.d}</div><button class=btn onclick="nxt()">${r.dead?"Ver desenlace":s.left>0?"Siguiente decisión":"Cerrar el año"}</button></div>`;
return `<div class="panel dp"><span class=lbl>${T[c.k]} · decisión ${s.n-s.left+1} de ${s.n}</span><h2>${c.who}</h2><span style="color:var(--m)">${c.role}</span><p>${c.txt}</p>${s.ord.map(i=>`<button class=item onclick=pick(${i})>${c.o[i].t}</button>`).join("")}</div>`}
function rCa(){const tl=Array.from({length:s.N},(_,j)=>{const h=s.hist[j];return h?`<div class=tl><span>Año ${j+1} · ${esc(h.i)}</span><b>${h.o}</b></div>`:j+1==s.yr?`<div class="tl cur"><span>Año ${j+1} · ${esc(s.inst)}</span><span>en curso</span></div>`:`<div class="tl f"><span>Año ${j+1}</span></div>`}).join("");
return `<div class=stage><div class=wrap style="width:100%"><div class="panel row" style="gap:16px;flex-wrap:wrap"><div class=ovr>${ovr()}<small>NIVEL</small></div><div style="flex:1;min-width:170px"><b style="font-size:18px">${esc(s.ap)}</b><div style="color:var(--m)">${cargo()} · ${esc(s.inst)}</div><span class=lbl>Año ${s.yr} de ${s.N} · edad ${s.age} · Clima ${s.enso}</span></div><div class=mts style="flex:3;min-width:260px">${meters(vis())}</div></div>
<div class="cols c2b" style="margin-top:16px"><div class=panel><p class=lbl>Este año</p>${s.log.length?s.log.map(l=>`<p style="margin:8px 0"><b>${l.w}</b><br><span style="color:var(--m)">${l.t}</span></p>`).join(""):`<p style="color:var(--m);margin-top:8px">Todavía no tomaste decisiones este año.</p>`}</div><div class=panel><p class=lbl style="margin-bottom:4px">Carrera</p>${tl}</div></div></div><div class=dock>${dp()}</div>${s.trans?trans():""}</div>`}
function fin(m,ok){s.msg=m;s.ok=ok;s.scr="en";s.trans=0;R()}
const LE=[[/^Escándalo/,"Aprendizaje: las concesiones personales se acumulan. Cada favor suma al expediente."],[/^Burnout/,"Aprendizaje: el desgaste también es un riesgo de gestión. Descansar es parte del trabajo."],[/jefatura/,"Aprendizaje: sin respaldo institucional no hay decisión que se sostenga."],[/cuenca/,"Aprendizaje: vigilá abastecimiento, producción y ambiente a la vez. Si uno cae demasiado, la cuenca entra en crisis."]];
function rEn(){const v=vis(),st=s.st||v,ok=s.ok;
const TT=[[ok&&v.cue>=65&&v.pres>=60,"Leyenda de la cuenca","Dejaste la cuenca mejor de como la encontraste y un nombre que se cita en el sector."],[ok&&v.int<35,"El que firmó todo","Llegaste al final, pero con demasiados favores en el expediente."],[ok&&v.rel>=65,"Tejedor de acuerdos","Tu legado son las relaciones: productores, gobierno y equipo te siguen."],[ok&&v.pla>=75,"Más patrimonio que cuenca","Lo que más creció fue tu bolsillo. El río, menos."],[ok&&ovr()>=70,"Referente técnico","Tu criterio se volvió la vara con la que miden al resto."],[ok,"Burócrata eficiente","Cumpliste: nada brilló demasiado, pero nada se rompió."],[1,s.msg.split(":")[0],s.msg.split(":").slice(1).join(":").trim()]];
const t=TT.find(x=>x[0]);const LRN=ok?"":(LE.find(x=>x[0].test(s.msg))||[0,""])[1];
const tiles=[["Años de carrera",s.yr],["Edad final",s.age],["Nivel profesional",ovr()],["Decisiones",s.cnt.x],["Casos técnicos",s.cnt.y+" / "+s.cnt.t],["Alianzas",s.cnt.z]];
const seg=[];s.hist.forEach((x,j)=>{const l=seg[seg.length-1];if(l&&l.i==x.i){l.to=j+1;l.o=x.o;l.c=x.c}else seg.push({i:x.i,c:x.c,from:j+1,to:j+1,o:x.o})});
const dl_=k=>{const x=v[k]-st[k];return x?`<span style="font-size:12px;color:${x>0?"var(--g)":"var(--r)"}">${x>0?"▲":"▼"}${Math.abs(x)} desde el inicio</span>`:`<span style="font-size:12px;color:var(--m)">sin cambios</span>`};
return `<div class=wrap style="max-width:940px"><div class="panel hero"><div class=mini>${vest()}</div><div><span class=lbl style="color:var(--a)">${ok?"Fin de carrera":"Carrera interrumpida"} · ${esc(s.ap)}</span><h1 class=big>${esc(t[1])}</h1><p style="color:var(--m);max-width:50ch;margin-top:8px">${t[2]}</p>${LRN?`<p style="max-width:50ch;margin-top:8px">${LRN}</p>`:""}</div></div>
<div class=tiles>${tiles.map(x=>`<div class=tile><span class=lbl>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>
<div class="cols c2b" style="margin-top:16px"><div class=panel><p class=lbl style="margin-bottom:12px">Balance final</p><div class=sgrid>${Object.keys(VL).map(k=>`<div><span class=lbl>${VL[k]}</span><div style="font-size:28px;font-weight:800;line-height:1.1">${v[k]}</div><div class=bar><i style="width:${v[k]}%;background:${v[k]<=25?"var(--r)":v[k]>=70?"var(--g)":"var(--m)"}"></i></div>${dl_(k)}</div>`).join("")}</div></div>
<div class=panel><p class=lbl style="margin-bottom:4px">Trayectoria</p>${seg.map(x=>`<div class=tl><span>${x.from==x.to?"Año "+x.from:"Años "+x.from+"–"+x.to} · ${esc(x.i)}</span><span style="color:var(--m)">${x.c}</span></div>`).join("")||`<p style="color:var(--m)">Carrera demasiado corta para registrar trayectoria.</p>`}<p class=lbl style="margin:16px 0 4px">Vitrina</p>${V.map(([f,n])=>{const g=s.gotC.includes(n)||f(s),o=vit.includes(n);return `<div class="vt${g?"":o?" ob":" lk"}"><span>${g||o?"✓":"○"}</span><span>${n}${g?"":o?" · de una carrera anterior":""}</span></div>`}).join("")}</div></div>
<div style="text-align:center;margin:22px 0"><button class=btn onclick="init()">Nueva carrera</button></div></div>`}
init();
</script></body></html>
