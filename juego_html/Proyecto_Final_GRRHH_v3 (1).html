<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego Virtual: Gestión de Recursos Hídricos</title>
<style>
:root{--bg:#0c0d10;--p:#14151a;--p2:#1b1c22;--b:#26282f;--t:#ecedef;--m:#8a8d97;--a:#d8791d;--g:#58a37c;--r:#c9584e}
*{box-sizing:border-box;margin:0;font:inherit}[hidden]{display:none!important}
body{background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;color:inherit;background:none;border:0}
input{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:9px;width:100%;text-align:center}
h2{font-weight:700;font-size:18px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px}
.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.c3{grid-template-columns:1fr 1.1fr 1fr}.c2b{grid-template-columns:1.4fr 1fr}}
.btn{background:#fff;color:#000;border-radius:99px;padding:10px 20px;font-weight:600}
.btn.o{background:none;color:var(--t);border:1px solid var(--t)}
.row{display:flex;gap:8px;align-items:center}
.bar{height:5px;background:var(--b);border-radius:9px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;transition:width .5s}
.ovr{width:62px;height:62px;border-radius:12px;background:var(--a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800;line-height:1;flex:none}
.ovr small{font-size:9px;font-weight:600;opacity:.85}
.item{border:1px solid var(--b);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--p2)}
.item:hover,.item.on{border-color:var(--t)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:340px;overflow:auto}
.mono{width:28px;height:28px;border-radius:6px;background:var(--b);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.mts{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px 14px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;background:var(--p2)}.chip.up{color:var(--g)}.chip.dn{color:var(--r)}
.stage{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between}
.dock{padding:16px;display:flex;justify-content:flex-start;position:sticky;bottom:0}
.dp{width:min(460px,100%);display:grid;gap:10px;box-shadow:0 8px 30px #000a;animation:up .3s}
.tl{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--b);font-size:13px}.tl.f{color:#474a54}.tl.cur{color:var(--a)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;overflow:auto}
.fade{animation:fd .6s}
.mc{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:22px;max-width:480px;width:100%;display:grid;gap:12px}
.v{font-weight:700}
@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></head><body><div id="app"></div>

const dead=s.v.int<=0?"Escándalo: se supo todo lo que firmaste de favor y quedaste fuera del sector.":s.v.jef<=0?"Destitución: la jefatura perdió toda la confianza en vos.":s.v.ene<=0?"Burnout: no diste más y pediste licencia sin fecha de regreso.":0;
s.left--;s.log.unshift({w:c.who,t:o.f});s.res={o,c,dead,d:chips(a,vis())};R()}
function nxt(){if(s.res.dead)return fin(s.res.dead);s.res=0;if(s.left>0)newCard();else if(closeY())return;R()}
function closeY(){ap({ene:8,pla:4});ap(Object.fromEntries(Object.keys(E[s.es][2]).map(k=>[k,2])));const nw=V.filter(([f,t])=>!vit.includes(t)&&f(s)).map(x=>x[1]);vit.push(...nw);try{localStorage.pa=JSON.stringify(vit)}catch(e){}
s.crit=Math.min(...B.map(k=>s.v[k]))<=10?s.crit+1:0;if(s.crit>=2){fin("Destitución: la cuenca entró en crisis dos años seguidos.");return 1}
s.hist.push({i:s.inst,o:ovr(),c:cargo()});s.T={hd:H.find(h=>h[0](s))[1],nw};s.trans=1}
function nsea(){if(s.yr>=s.N)return fin(`Cerrás tu carrera tras ${s.N} años: la cuenca queda en tus manos y el expediente al día.`,1);s.yr++;s.age++;if([4,8,12].includes(s.yr))offers();else startY()}
function trans(){const t=s.T;return `<div class="ov fade"><div class=mc><span class=lbl>Cierre del año ${s.yr} de ${s.N} · edad ${s.age}</span><h2>${t.hd}</h2><div>${chips(s.v0,vis())||`<span style="color:var(--m)">Año sin cambios grandes</span>`}</div><p style="color:var(--m)">Nivel profesional ${ovr()}${t.nw.length?". Logro: "+t.nw.join(", "):""}.</p><button class=btn onclick=nsea()>${s.yr>=s.N?"Ver desenlace":"Pasar al año "+(s.yr+1)}</button></div></div>`}
function dp(){const c=s.card,r=s.res;if(s.trans)return"";
if(r)return `<div class="panel dp"><span class=v style="color:${c.k=="tec"?r.o.g?"var(--g)":"var(--r)":"var(--a)"}">${c.k=="tec"?r.o.g?"Bien fundado":"No cierra con la normativa":"Consecuencias"}</span><p>${r.o.f}</p><div>${r.d}</div><button class=btn onclick="nxt()">${r.dead?"Ver desenlace":s.left>0?"Siguiente decisión":"Cerrar el año"}</button></div>`;
return `<div class="panel dp"><span class=lbl>${T[c.k]} · decisión ${s.n-s.left+1} de ${s.n}</span><h2>${c.who}</h2><span style="color:var(--m)">${c.role}</span><p>${c.txt}</p>${s.ord.map(i=>`<button class=item onclick=pick(${i})>${c.o[i].t}</button>`).join("")}</div>`}
function rCa(){const tl=Array.from({length:s.N},(_,j)=>{const h=s.hist[j];return h?`<div class=tl><span>Año ${j+1} · ${esc(h.i)}</span><b>${h.o}</b></div>`:j+1==s.yr?`<div class="tl cur"><span>Año ${j+1} · ${esc(s.inst)}</span><span>en curso</span></div>`:`<div class="tl f"><span>Año ${j+1}</span></div>`}).join("");
return `<div class=stage><div class=wrap style="width:100%"><div class="panel row" style="gap:16px;flex-wrap:wrap"><div class=ovr>${ovr()}<small>NIVEL</small></div><div style="flex:1;min-width:170px"><b style="font-size:18px">${esc(s.ap)}</b><div style="color:var(--m)">${cargo()} · ${esc(s.inst)}</div><span class=lbl>Año ${s.yr} de ${s.N} · edad ${s.age} · ENSO ${s.enso}</span></div><div class=mts style="flex:3;min-width:260px">${meters(vis())}</div></div>
<div class="cols c2b" style="margin-top:16px"><div class=panel><p class=lbl>Este año</p>${s.log.length?s.log.map(l=>`<p style="margin:8px 0"><b>${l.w}</b><br><span style="color:var(--m)">${l.t}</span></p>`).join(""):`<p style="color:var(--m);margin-top:8px">Todavía no tomaste decisiones este año.</p>`}</div><div class=panel><p class=lbl style="margin-bottom:4px">Carrera</p>${tl}</div></div></div><div class=dock>${dp()}</div>${s.trans?trans():""}</div>`}
function fin(m,ok){s.msg=m;s.ok=ok;s.scr="en";s.trans=0;R()}
function rEn(){const v=s.v,sc=(v.pres+(v.ab+v.pr+v.am)/3+v.int)/3,t=sc>=65?"Leyenda de la cuenca":v.int<35?"El que firmó todo":"Burócrata eficiente";
return `<div class=wrap><div class="panel" style="max-width:520px;margin:40px auto;display:grid;gap:10px"><span class=lbl>${s.ok?"Fin de carrera":"Carrera interrumpida"}</span><h2>${s.ok?t:"Cese del cargo"}</h2><p>${s.msg}</p><p style="color:var(--m)">Edad ${s.age}. Nivel ${ovr()}. Prestigio ${v.pres}. Expedientes ${s.cnt.x}, obras ${s.cnt.y}, alianzas ${s.cnt.z}.</p><p class=lbl>Vitrina</p><p style="color:var(--m)">${vit.length?vit.join(". "):"Vitrina vacía"}</p><button class=btn onclick="init()">Nueva carrera</button></div></div>`}
init();
</script></body></html>
